[build-system]
requires = ["flit_core >=3.8,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pydocsync"
version = "0.2.0"
description = "Deterministic code-documentation representation synchronization for AI-assisted Python codebases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "mpcoder1111" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Documentation",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
pydocsync = "pydocsync.cli:main"

[project.urls]
Homepage = "https://github.com/mpcoder1111/PyDocSync"
Repository = "https://github.com/mpcoder1111/PyDocSync"

[tool.flit.module]
name = "pydocsync"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
